<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">RakshakApp cloud architecture</title><desc id="desc">Vercel serves the React interface and trusted Node backend. Firebase Authentication supplies signed identity tokens. Permitted browser queries pass Firestore rules; the backend verifies tokens before grading against private Firestore answer keys. Firestore listeners synchronize authorized clients.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#55daca"/></marker><marker id="orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#ffbf73"/></marker></defs>
<rect width="1100" height="660" rx="20" fill="#101b2d"/>
<g font-family="Arial, sans-serif"><text x="42" y="42" fill="#ffffff" font-size="27" font-weight="700">RakshakApp · Cloud architecture</text><text x="42" y="68" fill="#b5c6dc" font-size="16">One school app · Vercel hosting and backend · Firebase identity and database</text>
<g fill="none" stroke="#55daca" stroke-width="3" marker-end="url(#arrow)"><path d="M320 188 H410"/><path d="M185 262 V366"/><path d="M350 440 H410"/><path d="M915 262 V366"/></g>
<path d="M185 112 V94 H915 V112" fill="none" stroke="#ffbf73" stroke-width="3" marker-end="url(#orange)"/>
<text x="410" y="87" fill="#ffbf73" font-size="14">Quiz submission + signed ID token</text>
<g fill="#192b44" stroke="#427e9c" stroke-width="1.5"><rect x="50" y="118" width="270" height="144" rx="13"/><rect x="420" y="118" width="270" height="144" rx="13"/><rect x="780" y="118" width="270" height="144" rx="13"/><rect x="50" y="376" width="300" height="146" rx="13"/><rect x="420" y="376" width="630" height="172" rx="13"/></g>
<g fill="#ffffff" font-size="21" font-weight="700"><text x="70" y="151">Browser interface</text><text x="440" y="151">Firebase Authentication</text><text x="800" y="151">Vercel Node backend</text><text x="70" y="409">Firestore Security Rules</text><text x="440" y="409">Cloud Firestore · Mumbai</text></g>
<g fill="#cbd9ea" font-size="16"><text x="70" y="180">React + Vite, served by Vercel</text><text x="70" y="207">Student / Teacher / Administrator</text><text x="70" y="234">Modules, map, games and drills</text><text x="440" y="180">Google or email/password login</text><text x="440" y="207">Signed identity token</text><text x="440" y="234">Trusted role + schoolId claims</text><text x="800" y="180">POST /api/cloud</text><text x="800" y="207">Verify identity and permissions</text><text x="800" y="234">Grade quiz; save trusted result</text><text x="70" y="440">School + role + record owner</text><text x="70" y="468">Validate allowed client writes</text><text x="70" y="495">Deny unauthorized access</text><text x="440" y="440">Users, schools, alerts, progress, quiz results, drills and SOS</text><text x="440" y="469">Private quizKeys: trusted backend only; client reads denied</text><text x="440" y="498">Server timestamps · indexed queries · bounded listeners</text><text x="440" y="527">Persistent records remain after refreshing the browser</text></g>
<text x="330" y="179" fill="#55daca" font-size="13">Sign in</text><text x="210" y="304" fill="#55daca" font-size="14">Permitted client SDK</text><text x="210" y="328" fill="#55daca" font-size="14">reads / writes</text><text x="735" y="300" fill="#55daca" font-size="14">Admin SDK:</text><text x="735" y="324" fill="#55daca" font-size="14">read private keys;</text><text x="735" y="348" fill="#55daca" font-size="14">save results</text>
<path d="M710 548 V584 H24 V218 H45" fill="none" stroke="#ffbf73" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#orange)"/><text x="225" y="575" fill="#ffbf73" font-size="15">Live updates to authorized browsers: onSnapshot()</text>
<text x="42" y="622" fill="#b5c6dc" font-size="15">GitHub stores source code. Vercel hosts the app. Firebase authenticates users and stores cloud data.</text></g></svg>
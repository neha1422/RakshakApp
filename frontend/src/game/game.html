<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    <title>disaster prepardeness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }
        
        /* Default - no scaling on desktop */
        #game-container canvas {
            display: block;
        }
        
        /* Mobile scaling */
        @media (max-width: 768px) {
            #game-container {
                transform: scale(0.8) translateX(-40px);
                transform-origin: center center;
            }
        }
        
        @media (max-width: 480px) {
            #game-container {
                transform: scale(0.7) translateX(-40px);
                transform-origin: center center;          }
        }
        
        @media (max-width: 360px) {
            #game-container {
                /* transform: scale(0.6); Makes everything 60% smaller on smallest phones */
                transform: translateX(-100px)
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://unpkg.com/kaplay@latest/dist/kaplay.js"></script>
    <script type="module" src="main.js"></script>

</body>
</html>
